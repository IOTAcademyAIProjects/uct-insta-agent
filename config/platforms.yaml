version: 3

platforms:
  instagram:
    enabled: true
    adapter: adapters.instagram.InstagramAdapter
    default_format: FEED
    supported_formats: [FEED, REEL, STORY, CAROUSEL]
    rate_limits:
      max_posts_per_day: 25

  linkedin:
    enabled: false
    adapter: adapters.linkedin.LinkedInAdapter
    default_format: FEED
    supported_formats: [FEED, DOCUMENT]
    rate_limits:
      max_posts_per_day: 10

  twitter:
    enabled: false
    adapter: adapters.twitter.TwitterAdapter
    default_format: FEED
    supported_formats: [FEED, THREAD]
    rate_limits:
      max_posts_per_day: 50

  youtube:
    enabled: false
    adapter: adapters.youtube.YouTubeAdapter
    default_format: SHORT
    supported_formats: [SHORT]
    rate_limits:
      max_posts_per_day: 5
